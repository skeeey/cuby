name: Build desktop installers

# Runs after every merge to main, and on manual dispatch. Artifacts only:
# nothing here publishes a release, so a build can be produced and inspected
# before anyone decides what to do with it.
#
# Upstream's own release workflow downloads finished installers from OSS rather
# than building them — their binaries come from internal CI — so this is ours to
# write. It calls the same packaging scripts a developer runs locally, which
# means the result is the build this repository defines, not a second pipeline.
#
# Signing stays off: the certificates are not in this repository's secrets, so
# the installers are unsigned and the OS will warn on first launch. That is the
# same trade the local packaging scripts already make.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp (leave empty to use the version in package.json)
        required: false
        type: string
      edition:
        description: Desktop edition
        required: false
        default: all
        type: choice
        options:
          - all
          - cn
          - intl
      platforms:
        description: Which installers to build
        required: false
        default: all
        type: choice
        options:
          - all
          - windows
          - macos
      mirror:
        description: Where packaging downloads its binaries from (off = GitHub)
        required: false
        default: "off"
        type: choice
        options:
          - "off"
          - cn

permissions:
  contents: read

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      edition: ${{ steps.version.outputs.edition }}
      platforms: ${{ steps.version.outputs.platforms }}
      mirror: ${{ steps.version.outputs.mirror }}
      windows_matrix: ${{ steps.version.outputs.windows_matrix }}
      macos_matrix: ${{ steps.version.outputs.macos_matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_EDITION: ${{ inputs.edition }}
          INPUT_PLATFORMS: ${{ inputs.platforms }}
          INPUT_MIRROR: ${{ inputs.mirror }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION// /}"
          if [ -z "$version" ]; then
            version="$(node -p "require('./App/shell/desktop/package.json').version")"
          fi
          edition="${INPUT_EDITION:-all}"
          platforms="${INPUT_PLATFORMS:-all}"
          mirror="${INPUT_MIRROR:-off}"

          case "$edition" in
            all) editions=(cn intl) ;;
            cn|intl) editions=("$edition") ;;
            *) echo "Unsupported edition: $edition" >&2; exit 1 ;;
          esac
          case "$platforms" in
            all|windows|macos) ;;
            *) echo "Unsupported platforms: $platforms" >&2; exit 1 ;;
          esac

          # Build the job matrices here so an edition/platform filter removes
          # the job instead of starting a runner only to skip it.
          windows=()
          macos=()
          if [ "$platforms" != "macos" ]; then
            for entry in "${editions[@]}"; do
              windows+=("{\"edition\":\"$entry\"}")
            done
          fi
          if [ "$platforms" != "windows" ]; then
            for entry in "${editions[@]}"; do
              macos+=("{\"runner\":\"macos-14\",\"arch\":\"arm64\",\"edition\":\"$entry\"}")
              macos+=("{\"runner\":\"macos-15-intel\",\"arch\":\"x64\",\"edition\":\"$entry\"}")
            done
          fi

          json_array() {
            local IFS=,
            printf '[%s]' "$*"
          }

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "edition=$edition" >> "$GITHUB_OUTPUT"
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"
          echo "mirror=$mirror" >> "$GITHUB_OUTPUT"
          echo "windows_matrix=$(json_array "${windows[@]}")" >> "$GITHUB_OUTPUT"
          echo "macos_matrix=$(json_array "${macos[@]}")" >> "$GITHUB_OUTPUT"

  windows:
    needs: resolve
    if: ${{ needs.resolve.outputs.windows_matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.windows_matrix) }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # The values the packaging chain reads from the repo-root .env. It refuses
      # to run without them, and they are public endpoint origins, not secrets.
      CUBY_LEGAL_CN_BASE_URL: https://memmy.cn
      CUBY_LEGAL_INTL_BASE_URL: https://memmy.bot
      CUBY_CLOUD_SERVICE: https://api.memmy.cn
      # package-win-local.sh defaults this to cn, so a developer machine and CI
      # have been downloading their packaging binaries from different places.
      CUBY_PACKAGE_MIRROR: ${{ needs.resolve.outputs.mirror }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the Windows installer
        shell: bash
        env:
          # Debug-level electron-builder output, so the packaging phase says
          # which step it is in instead of going quiet for the whole of it.
          DEBUG: electron-builder
        run: |
          set -u

          # electron-builder prints nothing between "copying unpacked Electron"
          # and "building target=...", so a stall anywhere in that stretch is
          # invisible in its own output. Sample the output directory on a timer
          # instead: an app.asar that keeps growing means still working, a frozen
          # one means stuck. This runs as its own process, so its lines reach the
          # job log directly and keep arriving while the build is stalled.
          unpacked_dir=App/shell/desktop/release/win-unpacked
          watch_packaging() {
            while true; do
              printf '[watch %s] app.asar=%s files=%s free=%s\n' \
                "$(date -u '+%H:%M:%S')" \
                "$(stat -c %s "$unpacked_dir/resources/app.asar" 2>/dev/null || echo 0)" \
                "$(find "$unpacked_dir" -type f 2>/dev/null | wc -l)" \
                "$(df -h . 2>/dev/null | tail -1 | awk '{print $4}')"
              sleep 60
            done
          }
          watch_packaging &
          watcher_pid=$!
          trap 'kill "$watcher_pid" 2>/dev/null || true' EXIT

          bash scripts/package-win.sh \
            --version "${{ needs.resolve.outputs.version }}" \
            --arch x64 \
            --edition "${{ matrix.edition }}" \
            --sign unsigned
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: cuby-windows-${{ needs.resolve.outputs.version }}-${{ matrix.edition }}
          path: App/shell/desktop/release/*.exe
          if-no-files-found: error
      - name: Zip the unpacked build
        shell: bash
        run: |
          # The packaged app is normally run from release/win-unpacked, which the
          # local run script points at, so ship that too rather than only the
          # installer.
          cd App/shell/desktop/release
          7z a -tzip "Cuby-${{ needs.resolve.outputs.version }}-win32-x64-${{ matrix.edition }}-unpacked.zip" win-unpacked >/dev/null
      - name: Upload the unpacked build
        uses: actions/upload-artifact@v4
        with:
          name: cuby-windows-${{ needs.resolve.outputs.version }}-${{ matrix.edition }}-unpacked
          path: App/shell/desktop/release/*-unpacked.zip
          if-no-files-found: error

  macos:
    needs: resolve
    if: ${{ needs.resolve.outputs.macos_matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.macos_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CUBY_LEGAL_CN_BASE_URL: https://memmy.cn
      CUBY_LEGAL_INTL_BASE_URL: https://memmy.bot
      CUBY_CLOUD_SERVICE: https://api.memmy.cn
      CUBY_PACKAGE_MIRROR: ${{ needs.resolve.outputs.mirror }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the macOS image
        shell: bash
        run: |
          bash scripts/package-mac.sh \
            --version "${{ needs.resolve.outputs.version }}" \
            --arch "${{ matrix.arch }}" \
            --edition "${{ matrix.edition }}" \
            --sign unsigned
      - name: Upload the image
        uses: actions/upload-artifact@v4
        with:
          name: cuby-macos-${{ needs.resolve.outputs.version }}-${{ matrix.arch }}-${{ matrix.edition }}
          path: App/shell/desktop/release/*.dmg
          if-no-files-found: error
