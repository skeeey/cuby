name: PR gate

# Repository-wide verification for every pull request: lint, typecheck, and the
# unit test suites. Platform-specific checks live in their own path-filtered
# workflows; this is the general gate.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # The agent's browser tests use mocked Playwright launchers, so the
      # browser binaries are not needed here.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install root workspace dependencies
        run: npm ci
      - name: Install standalone agent dependencies
        run: npm ci --prefix App/memmy-agent --include=dev
      - name: Lint
        run: npm run lint
      - name: Typecheck workspaces
        run: npm run typecheck
      - name: Typecheck standalone agent
        run: npm --prefix App/memmy-agent run typecheck
      - name: Test workspaces
        run: npm test
      - name: Test standalone agent
        run: npm --prefix App/memmy-agent test
