<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 278 54" width="278" height="54" role="img" aria-label="Cuby">
  <defs>
    <linearGradient id="cuby-body-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8A9AFF"/>
      <stop offset="1" stop-color="#5A6CF0"/>
    </linearGradient>
  </defs>
  <!-- 天线：细杆 + 橙色小球 -->
  <rect x="28.2" y="4.5" width="2.6" height="7.5" rx="1.3" fill="#7A8BFF"/>
  <circle cx="29.5" cy="3.6" r="3.6" fill="#FFA94D"/>
  <!-- 头部：圆角方形，蓝紫渐变（深底上调亮） -->
  <rect x="6" y="8" width="48" height="42" rx="12" fill="url(#cuby-body-dark)"/>
  <!-- 屏幕脸：深色面板 -->
  <rect x="14" y="16" width="32" height="28" rx="8" fill="#16142B"/>
  <!-- 眼睛：大白圆 + 黑瞳 -->
  <circle cx="23" cy="28" r="4.8" fill="#FFFFFF"/>
  <circle cx="37" cy="28" r="4.8" fill="#FFFFFF"/>
  <circle cx="23.9" cy="28.8" r="2.2" fill="#101018"/>
  <circle cx="36.1" cy="28.8" r="2.2" fill="#101018"/>
  <!-- 腮红 -->
  <ellipse cx="17.2" cy="35.5" rx="3.3" ry="2.1" fill="#FF8FA3" opacity="0.9"/>
  <ellipse cx="42.8" cy="35.5" rx="3.3" ry="2.1" fill="#FF8FA3" opacity="0.9"/>
  <!-- 字标：白色字（给深色底） -->
  <text x="62" y="38" font-family="Inter, 'SF Pro Display', 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="0.5" fill="#FFFFFF">Cuby</text>
</svg>
